<section class="projetos" id="projetos">
    <span class="rotulo">Projetos</span>
    <h2>Um pouco do que já construí</h2>

    <div class="carrossel">
        <button class="seta seta-esquerda" (click)="anterior()" aria-label="Projeto anterior">←</button>

        <div class="grade-projetos" #trilha>
            @for (projeto of projetos; track projeto.titulo) {
            <article class="projeto">
                <div class="projeto-capa"></div>
                <h3>{{ projeto.titulo }}</h3>
                <p>{{ projeto.descricao }}</p>
                <div class="projeto-tecs">
                    @for (tag of projeto.tags; track tag) {
                    <span>{{ tag }}</span>
                    }
                </div>
            </article>
            }
        </div>
        <button class="seta seta-direita" (click)="proximo()" aria-label="Próximo projeto">→</button>
    </div>
</section>

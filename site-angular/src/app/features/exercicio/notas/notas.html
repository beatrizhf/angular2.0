<form (submit)="cadastrarAluno($event)">
  <div>
    <label for="nome">Nome:</label>
    <input type="text" id="nome" [formField]="alunoForm.nome">
  </div>
  <div>
    <label for="media">Média:</label>
    <input type="number" id="media" [formField]="alunoForm.media" step="0.01">
  </div>
  <button type="submit">Cadastrar</button>
</form>

<div class="listaItens">
<h2>Lista de Alunos Cadastrados</h2>
<div class="cadaAluno">
    @for (aluno of alunos(); track aluno.nome) {
      <div class="listaAluno">
        <p> Aluno: {{aluno.nome}} | Média: {{aluno.media}} | <strong>{{aluno.situacao}}</strong></p>
        </div>
    }

    @empty {
        <p>Nenhum aluno cadastrado.</p>
    }
</div>
</div>
